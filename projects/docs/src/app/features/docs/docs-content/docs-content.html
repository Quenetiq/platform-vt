<div class="docs-content">
  @if (loading()) {
    <div class="docs-loading">Loading...</div>
  } @else if (error()) {
    <div class="docs-error">
      <h2>404</h2>
      <p>{{ error() }}</p>
      <a routerLink="/getting-started">Go to Getting Started</a>
    </div>
  } @else {
    @if (sample()) {
      <div class="docs-demo">
        <app-terminal-preview [sample]="sample()!" [rows]="8"></app-terminal-preview>
      </div>
    }
    <article class="docs-article" [innerHTML]="contentHtml()"></article>
  }
</div>
