name: Release

# The release version is taken from projects/platform-vt/package.json —
# bump it there, then run this workflow (or push the matching v* tag).
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Lint
        run: npx ng lint platform-vt

      - name: Test
        run: npx ng test platform-vt --no-watch

      - name: Build library
        run: npx ng build platform-vt

      - name: Resolve version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./projects/platform-vt/package.json').version")
          echo "Version from package.json: $VERSION"
          # When triggered by a tag push, the tag must match the package
          # version — the package.json is the single source of truth.
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
            if [ "$TAG" != "v$VERSION" ]; then
              echo "::error::Tag '$TAG' does not match package.json version 'v$VERSION'"
              exit 1
            fi
          fi
          node -e "const fs=require('fs');const p='dist/platform-vt/package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')" "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        # The `./` prefix matters: without it npm parses "dist/platform-vt"
        # as a GitHub "user/repo" git shorthand instead of a folder.
        run: npm publish ./dist/platform-vt --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Ensure git tag
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true